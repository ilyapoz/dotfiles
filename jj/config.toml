#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Ilia Pozhilov"

[ui]
default-command = "log"
diff-editor = ":builtin"
describe-show-full-diff = true

[revsets]
bookmark-advance-to = '@-'
log = 'this'

[aliases]
r = ['log', '-r', 'recent']
gp = ['git', 'push']
gf = ['git', 'fetch']
lint = ['run', 'jj_lint_diff']
pr = ["util", "exec", "--", "jj-gh", "pr"]

[revset-aliases]
'why_immutable(r)' = '(r & immutable()) | roots(r:: & immutable_heads())'
upstream = 'fork_point(@ | trunk())'
stack = 'stack(@)'
'stack(r)' = 'reachable(r, mutable())'
'with_base(r)' = 'ancestors(r, 2)'
'mutable_heads()' = 'heads(mutable())'
'state(r)' = 'present(@) | trunk() | with_base(r)'
this = 'state(stack)'
local = 'state(mutable())'
recent = 'recent("2 weeks ago")'
'recent(ago)' = 'state(stack(mutable_heads() & committer_date(after:ago)))'
'tip(merge,branch)' = 'merge- & branch::'

[templates]
git_push_bookmark = "git_push_bookmark_template"
draft_commit_description = """
concat(
  builtin_draft_commit_description ++ "\n",
  indent("JJ: ", concat(
    if(config("ui.describe-show-full-diff").as_boolean(),
      concat(
        "\n",
        "Full diff of " ++ format_short_change_id(self.change_id()) ++ ":\n",
        self.diff().git(),
      )
    ),
  )),
)
"""

[template-aliases]
'format_timestamp(timestamp)' = 'timestamp.ago()'

# Newline-separated paths of a diff entry, for feeding `jj diff` into xargs-style
# tools. Unlike `--name-only`, bare `path` stays repo-relative from any subdirectory.
repo_paths = 'path ++ "\n"'

# Unredact operation attributes in builtin_op_log_redacted: show the real
# attributes instead of the literal "(redacted)". User/workspace stay hashed.
'format_operation_redacted(op)' = '''
concat(
  separate(" ",
    format_short_operation_id(op.id()),
    format_user_redacted(op.user()),
    format_workspace_redacted(op.workspace_name()),
    format_time_range(op.time()),
  ), "\n",
  op.description().first_line(), "\n",
  surround("", "\n", op.attributes()),
)
'''

subject = 'description.first_line()'
ticket = 'subject.match(regex:"^[A-Z][A-Z0-9_]*-[0-9]+: ").remove_suffix(": ").replace(regex:"^[A-Z]+-0$","")'
'remove_ticket(subject)' = 'subject.replace(regex:"^[A-Z][A-Z0-9_]*-[0-9]+:\\s*", "")'
'slugify(str)' = 'str.lower().replace(regex:"[^a-z0-9]+", "-").remove_prefix("-").remove_suffix("-")'


git_push_bookmark_template= '''
committer.email().local() ++ "/" ++
if(description,
  surround("", "/", ticket) ++
  slugify(remove_ticket(subject))
)
'''

# Hyperlinks!
'format_short_commit_id(id)' = 'hyperlink(git_web_url() ++ "/commit/" ++ id, format_short_id(id))'

'format_short_signature(signature)' = 'if(stringify(signature.email()) != config("user.email").as_string(), signature.email().local())'

[fsmonitor]
backend = "watchman"

[fsmonitor.watchman]
register-snapshot-trigger = true

[jj-gh]
pr_create_template = 'description.remove_prefix(description.first_line()).trim_start()'